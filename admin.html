<html lang="ar" dir="rtl">
<head>

<style>
:root{--panel:rgba(9,11,44,.8);--text:#f3ecff;--muted:#a9b0d8;--cyan:#19f0ff;--org:#ffb347;--org2:#ff7a18;--mag:#ff2fb3;--grn:#00ff9c;--line:rgba(25,240,255,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#0b0f4a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.7;background:linear-gradient(180deg,#0b0f4a 0%,#1b1659 45%,#5a2f4a 80%,#7a3b2e 100%) fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0b0f4a;z-index:10}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.28;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 16px 110px}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -16px 16px;padding:10px 16px;background:rgba(10,12,50,.88);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.logo{direction:ltr;text-align:center;line-height:1}
.l1{display:block;font-family:"Bebas Neue",Impact,sans-serif;font-size:2.3rem;letter-spacing:1px;color:#16235a;-webkit-text-stroke:1.5px var(--org);text-shadow:0 0 5px #ff9d2e,0 0 14px var(--org2),2px 2px 0 #c2610f,4px 4px 0 #7c2d12}
.l2{display:block;font-family:"Orbitron",sans-serif;font-weight:900;font-size:.62rem;letter-spacing:.6em;padding-left:.6em;margin-top:6px;color:#e8ffff;text-shadow:0 0 6px var(--cyan),0 0 14px var(--mag)}
.bal{display:flex;gap:6px}
.pill{border:1px solid var(--line);border-radius:8px;padding:2px 10px;text-align:center;background:rgba(0,0,0,.35);line-height:1.3}
.pill small{display:block;font-size:.68rem;color:var(--muted)}
.pill b{font-family:"Orbitron",sans-serif;font-size:1rem;color:var(--grn);text-shadow:0 0 8px var(--grn)}
.pill.v{border-color:var(--org)}.pill.v b{color:var(--org);text-shadow:0 0 8px var(--org2)}
.anon .hd{flex-direction:column;background:none;border:0;backdrop-filter:none;padding-top:24px;position:static}
.anon .l1{font-size:clamp(3.4rem,17vw,5.6rem);-webkit-text-stroke-width:2px;text-shadow:0 0 6px #ff9d2e,0 0 18px var(--org2),0 0 40px rgba(255,122,24,.55),3px 3px 0 #c2610f,6px 6px 0 #7c2d12,9px 12px 18px rgba(0,0,0,.5)}
.anon .l2{font-size:clamp(1.4rem,7vw,2rem);margin-top:14px}
.anon .bal,.anon .nav{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 0 14px rgba(25,240,255,.12),inset 0 0 24px rgba(25,240,255,.04)}
h2{font-size:1.1rem;font-weight:800;margin:0 0 10px;color:var(--cyan);text-shadow:0 0 8px rgba(25,240,255,.6)}
h3{font-size:1.15rem;font-weight:800;margin:18px 0 10px;color:var(--org);text-shadow:0 0 10px rgba(255,150,40,.6)}
.sub{color:var(--muted);font-size:.88rem;margin:0 0 10px}
label.f{display:block;font-weight:700;font-size:.92rem;margin:10px 0 6px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.btn{width:100%;padding:13px;border:1px solid var(--org);border-radius:8px;background:rgba(255,179,71,.12);color:var(--org);font-weight:800;font-size:1.02rem;text-shadow:0 0 8px rgba(255,150,40,.7);box-shadow:0 0 12px rgba(255,150,40,.3)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.go{background:linear-gradient(90deg,#ff7a18,#ffb347);color:#1a0f00;text-shadow:none;border:0}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],select{font:inherit;width:100%;padding:11px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;background:rgba(5,7,30,.85);color:var(--text)}
.two{display:flex;gap:8px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.opt{flex:1;min-width:140px;display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;font-weight:700;font-size:.92rem}
.opt input{accent-color:var(--org)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--muted);margin:0 0 12px}
.chk input{margin-top:6px;accent-color:var(--org)}
.it{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px dashed var(--line)}
.it:first-child{border-top:0}
.nm{flex:1;font-weight:700}
.nm small{display:block;color:var(--muted);font-weight:400;font-size:.82rem;line-height:1.5}
.pr{direction:ltr;text-align:right;font-family:"Orbitron",sans-serif;font-weight:700;color:var(--org);text-shadow:0 0 8px rgba(255,150,40,.7);white-space:nowrap}
.pr s{color:#ff6b8a;text-shadow:none;margin-right:8px;font-size:.85em}
.pr em{font-style:normal;font-family:"Tajawal",sans-serif;font-size:.78rem;color:var(--muted);text-shadow:none;margin-left:4px}
.tp{font-family:"Orbitron",sans-serif;color:var(--org);font-weight:700;white-space:nowrap}
.sm{padding:8px 14px;border-radius:8px;border:1px solid var(--cyan);background:none;color:var(--cyan);font-weight:700;white-space:nowrap;text-decoration:none;display:inline-block;font-size:.9rem}
.sm:disabled{border-color:var(--line);color:var(--muted);cursor:default}
.ok{color:var(--grn);font-weight:700;font-size:.9rem;white-space:nowrap}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1;padding:10px 4px;border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;font-weight:700}
.seg button.on{color:var(--cyan);border-color:var(--cyan);background:rgba(25,240,255,.08);box-shadow:0 0 10px rgba(25,240,255,.3)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px}
.dy{border:1px solid var(--line);border-radius:8px;padding:6px 0;text-align:center;font-size:.7rem;color:var(--muted)}
.dy b{display:block;font-family:"Orbitron",sans-serif;font-size:.95rem;color:var(--text)}
.dy.on{border-color:var(--grn);background:rgba(0,255,156,.12)}.dy.on b{color:var(--grn);text-shadow:0 0 8px var(--grn)}
.wheelwrap{position:relative;width:min(320px,100%);margin:10px auto 14px}
#wheel{display:block;width:100%;height:auto;filter:drop-shadow(0 0 14px rgba(255,122,24,.6));transition:transform 4.5s cubic-bezier(.12,.7,.15,1)}
.ptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);border-left:14px solid transparent;border-right:14px solid transparent;border-top:30px solid var(--cyan);filter:drop-shadow(0 0 8px var(--cyan));z-index:2}
.res{text-align:center;font-weight:800;font-size:1.2rem;color:var(--org);text-shadow:0 0 10px var(--org2);min-height:2em}
.boost{text-align:center;margin-bottom:8px}
.boost span{display:inline-block;padding:3px 14px;border-radius:20px;border:1px solid var(--mag);color:#ffd1f0;background:rgba(255,47,179,.18);font-weight:700;font-size:.88rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);font-weight:700;font-size:.9rem}
.chip i{width:10px;height:10px;border-radius:50%}
.chip.g{border-color:var(--org);color:var(--org);background:rgba(255,179,71,.1)}
.tot{font-weight:800;color:var(--org);margin:6px 0 10px;text-shadow:0 0 8px rgba(255,150,40,.5)}
.vc{border:1px dashed var(--org);border-radius:8px;padding:10px;margin-bottom:10px;font-size:.92rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vc b{font-family:"Orbitron",sans-serif;direction:ltr;color:var(--org);letter-spacing:1px}
.badge{display:inline-block;padding:2px 12px;border-radius:20px;font-weight:700;font-size:.82rem;border:1px solid var(--org);color:var(--org);background:rgba(255,179,71,.12)}
.badge.ok2{border-color:var(--grn);color:var(--grn);background:rgba(0,255,156,.1)}
.od small{display:block;color:var(--muted);font-size:.84rem;margin:2px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ava{width:104px;height:104px;border-radius:50%;margin:0 auto 12px;border:2px solid var(--cyan);box-shadow:0 0 16px rgba(25,240,255,.5);display:grid;place-items:center;font-family:"Orbitron",sans-serif;font-size:2.4rem;color:var(--cyan);background:#0a0d3a center/cover}
.err{color:#ff7b9c;font-size:.85rem;min-height:1.3em}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:8px 4px}
.ghost{background:none;border:1px solid var(--line);color:var(--text);padding:12px;border-radius:8px}
.row{display:flex;gap:8px;margin-top:6px}.row button{flex:1}
dialog{border:1px solid var(--cyan);border-radius:12px;background:#0b0e3a;color:var(--text);max-width:340px;width:90%;padding:20px;box-shadow:0 0 24px rgba(25,240,255,.35)}
dialog::backdrop{background:rgba(2,3,20,.7)}
dialog p{margin:0 0 12px;font-weight:700}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:6;display:flex;background:rgba(7,9,38,.95);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(6px)}
.nav button{flex:1;background:none;border:0;color:var(--muted);font-weight:700;font-size:.78rem;padding:4px 2px;display:flex;flex-direction:column;align-items:center}
.nav button span{font-size:1.3rem;line-height:1.3}
.nav button.on{color:var(--org);text-shadow:0 0 10px var(--org2)}
.msg{position:fixed;inset:auto 16px calc(84px + env(safe-area-inset-bottom,0px)) 16px;max-width:488px;margin:0 auto;z-index:11;background:#0b0e3a;border:1px solid var(--org);padding:12px 16px;border-radius:10px;font-weight:700;text-align:center;box-shadow:0 0 16px rgba(255,150,40,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.msg.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header class="hd"><div class="logo"><span class="l1">THEBANGER</span><span class="l2">ADMIN</span></div><button class="sm" id="out" style="display:none">خروج</button></header>
  <section class="card" id="login">
    <h2>دخول الإدارة</h2>
    <input id="em" type="email" dir="ltr" placeholder="البريد الإلكتروني" autocomplete="username">
    <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button class="btn" id="go">دخول</button>
  </section>
  <main id="adm" hidden>
    <div class="seg" id="tabs"><button class="on" data-t="orders">الطلبات <span id="cO"></span></button><button data-t="cust">العملاء</button><button data-t="prz">الجوائز <span id="cP"></span></button></div>
    <div id="v-orders"></div>
    <div id="v-cust" hidden><input id="q" type="text" placeholder="ابحث بالاسم أو البريد"><div id="cl"></div></div>
    <div id="v-prz" hidden></div>
  </main>
</div>
<div class="msg" id="msg" role="status"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,updateDoc,query,orderBy,limit,where,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const ADMIN_EMAIL="mostafamike08@gmail.com";
const app=initializeApp({apiKey:"AIzaSyAN2seN9XSeyBlNoDSng95Gc8LCywGBOH8",authDomain:"thebanger-78690.firebaseapp.com",projectId:"thebanger-78690",storageBucket:"thebanger-78690.firebasestorage.app",messagingSenderId:"990045262850",appId:"1:990045262850:web:0dde71eee16f1017a8031b"}),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const SV=[{n:"حلاقة دقن",p:30},{n:"استشوار",p:40},{n:"حلاقة",p:50},{n:"حلاقة + استشوار",p:110,b:1}];
const todayS=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let users={},orders=[],prizes=[],unsubs=[],first=true,tab="orders",ctx=null;
function toast(m){const e=$("msg");e.textContent=m;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),3000)}
function beep(){try{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(ctx.currentTime+.4)}catch(e){}}
function ping(o){
  beep();document.title="🔔 طلب جديد – THEBANGER";
  try{if(Notification.permission==="granted")new Notification("طلب جديد",{body:o.name+" – "+o.sv})}catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)document.title="THEBANGER – لوحة الإدارة"});
$("go").onclick=async()=>{
  try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  try{Notification.requestPermission()}catch(e){}
  $("err").textContent="";
  try{const c=await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value);await c.user.reload();await c.user.getIdToken(true);gate(auth.currentUser)}catch(e){$("err").textContent="البريد أو كلمة المرور غير صحيحة."}
};
$("out").onclick=()=>signOut(auth);
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  ["orders","cust","prz"].forEach(k=>$("v-"+k).hidden=k!==tab);
});
$("q").oninput=()=>draw();
const setSt=(o,st,msg)=>{if(confirm(msg+" للعميل "+o.name+"؟"))updateDoc(doc(db,"orders",o.id),{st}).catch(()=>toast("تعذّر الحفظ"))};
async function addSvc(id,u,sv){
  if(!confirm("تأكيد «"+sv.n+"» للعميل "+u.name+"؟"))return;
  let add=sv.p,note="";
  if(u.lastSvc){const dd=Math.round((new Date(todayS()+"T00:00:00")-new Date(u.lastSvc+"T00:00:00"))/864e5);if(dd>0&&dd<=21){add+=10;note=" (شاملة مكافأة العودة المبكرة)"}}
  const upd={vp:increment(add),lastSvc:todayS()};if(sv.b)upd.boost=increment(1);
  try{await updateDoc(doc(db,"users",id),upd);toast("تمت إضافة "+add+" نقطة VIP"+note)}catch(e){toast("تعذّر الحفظ")}
}
function orderCard(o){
  const c=E("div","card od"),top=E("div","it"),nm=E("div","nm","طلب #"+o.id.slice(0,5).toUpperCase()+" – "+o.name);
  top.style.padding="0";top.appendChild(nm);
  const ok=o.st==="ok",no=o.st==="no";
  top.appendChild(E("span","badge"+(ok?" ok2":""),o.st==="p"?"قيد المراجعة":ok?"تمت الموافقة":"مرفوض"));
  c.appendChild(top);
  [o.email,"الخدمة: "+o.sv,"الإجمالي: "+o.sum+" جنيه"+(o.beard?" + حلاقة الدقن":"")+" – الدفع: "+o.pay,"الموعد: "+o.date+(o.time?" – "+o.time:""),o.note?"ملاحظات: "+o.note:"","أُرسل: "+new Date(o.ts).toLocaleString("ar")].filter(Boolean).forEach(t=>c.appendChild(E("small","",t)));
  if(o.st==="p"){
    const a=E("div","acts"),y=E("button","sm","موافقة"),n=E("button","sm","رفض");
    y.onclick=()=>setSt(o,"ok","الموافقة على الطلب");n.onclick=()=>setSt(o,"no","رفض الطلب");
    a.append(y,n);c.appendChild(a);
  }
  return c;
}
function draw(){
  if(!$("adm")||$("adm").hidden)return;
  const pend=orders.filter(o=>o.st==="p"),done=orders.filter(o=>o.st!=="p").slice(0,15);
  $("cO").textContent=pend.length?"("+pend.length+")":"";$("cP").textContent=prizes.length?"("+prizes.length+")":"";
  const vo=$("v-orders");vo.innerHTML="";
  vo.appendChild(E("h3","","قيد المراجعة"));
  if(!pend.length)vo.appendChild(E("div","card","لا توجد طلبات جديدة."));
  pend.forEach(o=>vo.appendChild(orderCard(o)));
  if(done.length){vo.appendChild(E("h3","","الطلبات السابقة"));done.forEach(o=>vo.appendChild(orderCard(o)))}
  const q=$("q").value.trim().toLowerCase(),cl=$("cl");cl.innerHTML="";
  Object.entries(users).filter(([id,u])=>!q||(u.name+" "+u.email).toLowerCase().includes(q)).sort((a,b)=>(a[1].name||"").localeCompare(b[1].name||"","ar")).forEach(([id,u])=>{
    const c=E("div","card od");
    c.appendChild(E("div","nm",u.name));c.appendChild(E("small","",u.email));
    c.appendChild(E("small","","نقاط عادية: "+u.np+" – نقاط VIP: "+u.vp+" – حظ مضاعف: "+(u.boost||0)+(u.lastSvc?" – آخر خدمة: "+u.lastSvc:"")));
    const a=E("div","acts");
    SV.forEach(sv=>{const b=E("button","sm",sv.n+" (+"+sv.p+")");b.disabled=u.lastSvc===todayS();b.onclick=()=>addSvc(id,u,sv);a.appendChild(b)});
    c.appendChild(a);cl.appendChild(c);
  });
  if(!cl.children.length)cl.appendChild(E("div","card","لا يوجد عملاء."));
  const vp=$("v-prz");vp.innerHTML="";
  if(!prizes.length)vp.appendChild(E("div","card","لا توجد جوائز بانتظار التسليم."));
  prizes.forEach(p=>{
    const c=E("div","card od"),u=users[p.uid]||{};
    c.appendChild(E("div","nm",p.name));
    c.appendChild(E("small","","العميل: "+(u.name||"—")+" – "+(p.kind==="v"?"عجلة VIP":"العجلة العادية")+" – "+p.day));
    const a=E("div","acts"),b=E("button","sm","تم التسليم");
    b.onclick=()=>{if(confirm("تأكيد تسليم «"+p.name+"»؟"))updateDoc(doc(db,"prizes",p.id),{used:true}).catch(()=>toast("تعذّر الحفظ"))};
    a.appendChild(b);c.appendChild(a);vp.appendChild(c);
  });
}
function start(){
  first=true;
  unsubs.push(onSnapshot(collection(db,"users"),q=>{users={};q.docs.forEach(d=>users[d.id]=d.data());draw()},e=>{$("err").textContent="تعذّر قراءة العملاء ("+e.code+"). تأكد من نشر القواعد."}));
  unsubs.push(onSnapshot(query(collection(db,"orders"),orderBy("ts","desc"),limit(100)),q=>{
    if(!first)q.docChanges().forEach(c=>{if(c.type==="added"&&c.doc.data().st==="p")ping(c.doc.data())});
    first=false;orders=q.docs.map(d=>({id:d.id,...d.data()}));draw();
  },e=>{$("err").textContent="تعذّر قراءة الطلبات ("+e.code+"). تأكد من نشر القواعد وأن بريد الإدارة فيها مطابق."}));
  unsubs.push(onSnapshot(query(collection(db,"prizes"),where("used","==",false)),q=>{prizes=q.docs.map(d=>({id:d.id,...d.data()}));draw()},()=>{}));
}
function gate(u){
  unsubs.forEach(f=>f());unsubs=[];
  const mail=u?(u.email||"").toLowerCase():"",adm=ADMIN_EMAIL.toLowerCase();
  const ok=!!u&&mail===adm&&u.emailVerified;
  $("login").hidden=ok;$("adm").hidden=!ok;$("out").style.display=u?"":"none";
  let m="";
